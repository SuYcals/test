name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update && sudo apt-get install -y \
            bc bison build-essential flex libssl-dev libncurses5-dev \
            git wget gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          make O=out certus_defconfig
          make O=out -j$(nproc) KCFLAGS="-Wno-error=array-bounds -Wno-error=stringop-overflow -Wno-error=dangling-pointer -Wno-error=maybe-uninitialized -Wno-error=address -Wno-error=unused-const-variable -Wno-error=nonnull"
